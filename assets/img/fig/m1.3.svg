<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Kaya identity train"><title>Kaya identity train</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Multiply, never add</text><text class="fg-s" x="24" y="54">CO2 = people × income per person × energy per dollar × CO2 per unit of energy</text><g><animateTransform attributeName="transform" type="translate" values="-60 0;30 0;-60 0" dur="6s" repeatCount="indefinite"/><g><rect x="60" y="150" width="150" height="90" rx="12" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="3"/><path class="fg-ic " d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6M16 4.5a3.2 3.2 0 0 1 0 6.2M18 14.3c2 .8 3.3 2.9 3.6 5.7" transform="translate(120.0,165.0) scale(1.25)" stroke="var(--economy,#5a4e8c)" stroke-width="1.76"/><text class="fg-t" x="135" y="222" text-anchor="middle">People</text><circle cx="90" cy="250" r="12" fill="var(--ink,#14283a)"/><circle cx="180" cy="250" r="12" fill="var(--ink,#14283a)"/></g><text class="fg-h" x="220" y="200" text-anchor="middle" style="font-size:26px">×</text><g><rect x="230" y="150" width="150" height="90" rx="12" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="3"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15 9c-.5-1-1.6-1.5-3-1.5-1.8 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.5 0-2.6-.6-3-1.6M12 6v1.5M12 16.5V18" transform="translate(290.0,165.0) scale(1.25)" stroke="var(--economy,#5a4e8c)" stroke-width="1.76"/><text class="fg-t" x="305" y="222" text-anchor="middle">$ per person</text><circle cx="260" cy="250" r="12" fill="var(--ink,#14283a)"/><circle cx="350" cy="250" r="12" fill="var(--ink,#14283a)"/></g><text class="fg-h" x="390" y="200" text-anchor="middle" style="font-size:26px">×</text><g><rect x="400" y="150" width="150" height="90" rx="12" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="3"/><path class="fg-ic " d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" transform="translate(460.0,165.0) scale(1.25)" stroke="var(--energy,#b8790f)" stroke-width="1.76"/><text class="fg-t" x="475" y="222" text-anchor="middle">Energy per $</text><circle cx="430" cy="250" r="12" fill="var(--ink,#14283a)"/><circle cx="520" cy="250" r="12" fill="var(--ink,#14283a)"/></g><text class="fg-h" x="560" y="200" text-anchor="middle" style="font-size:26px">×</text><g><rect x="570" y="150" width="150" height="90" rx="12" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" stroke-width="3"/><path class="fg-ic " d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 9 0 4 3 7 7 7z" transform="translate(630.0,165.0) scale(1.25)" stroke="var(--climate,#a8323e)" stroke-width="1.76"/><text class="fg-t" x="645" y="222" text-anchor="middle">CO2 per energy</text><circle cx="600" cy="250" r="12" fill="var(--ink,#14283a)"/><circle cx="690" cy="250" r="12" fill="var(--ink,#14283a)"/></g></g><g class="fg-pulse"><path d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z" transform="translate(760,120) scale(4.4)" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" stroke-width=".6"/><text class="fg-h" x="812" y="190" text-anchor="middle">= CO2</text></g><line x1="20" y1="264" x2="880" y2="264" stroke="var(--line,#d3dde3)" stroke-width="4"/><text class="fg-t" x="450" y="320" text-anchor="middle">Halve any one carriage and the whole train halves: 10% fewer people or 10% cleaner energy cut CO2 by 10%.</text></svg>
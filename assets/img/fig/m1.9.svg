<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Water energy food nexus"><title>Water energy food nexus</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">The water–energy–food nexus</text><text class="fg-s" x="24" y="54">Farms, power plants and towns draw on the same river basin; bioenergy links land to energy</text><circle cx="330" cy="170" r="105" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="3" opacity=".9" class="fg-pulse"/><circle cx="470" cy="170" r="105" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="3" opacity=".75" class="fg-pulse" style="animation-delay:.8s"/><circle cx="400" cy="275" r="105" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="3" opacity=".75" class="fg-pulse" style="animation-delay:1.6s"/><path class="fg-ic " d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" transform="translate(272.0,122.0) scale(1.5)" stroke="var(--water,#2470a8)" stroke-width="1.47"/><text class="fg-h" x="290" y="185" text-anchor="middle">Water</text><path class="fg-ic " d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" transform="translate(492.0,122.0) scale(1.5)" stroke="var(--energy,#b8790f)" stroke-width="1.47"/><text class="fg-h" x="510" y="185" text-anchor="middle">Energy</text><path class="fg-ic " d="M12 22V8M12 8c-3 0-4-3-4-5 3 0 4 3 4 5zM12 8c3 0 4-3 4-5-3 0-4 3-4 5zM12 14c-3 0-4-3-4-5 3 0 4 3 4 5zM12 14c3 0 4-3 4-5-3 0-4 3-4 5z" transform="translate(382.0,282.0) scale(1.5)" stroke="var(--land,#4e7f2f)" stroke-width="1.47"/><text class="fg-h" x="400" y="345" text-anchor="middle">Food</text><text class="fg-s" x="400" y="160" text-anchor="middle">cooling</text><text class="fg-s" x="335" y="245" text-anchor="middle">irrigation</text><text class="fg-s" x="470" y="245" text-anchor="middle">bioenergy</text><g class=""><rect class="fg-box" x="640.0" y="88.0" width="220" height="64" rx="14" stroke="var(--water,#2470a8)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" transform="translate(653.0,107.0) scale(1.0833333333333333)" stroke="var(--water,#2470a8)" stroke-width="2.03"/><text class="fg-h" x="764" y="116" text-anchor="middle" style="font-size:16px">Basin limit</text><text class="fg-s" x="764" y="136" text-anchor="middle">renewable water first</text></g><g class=""><rect class="fg-box" x="640.0" y="198.0" width="220" height="64" rx="14" stroke="var(--climate,#a8323e)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15 9c-.5-1-1.6-1.5-3-1.5-1.8 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.5 0-2.6-.6-3-1.6M12 6v1.5M12 16.5V18" transform="translate(653.0,217.0) scale(1.0833333333333333)" stroke="var(--climate,#a8323e)" stroke-width="2.03"/><text class="fg-h" x="764" y="226" text-anchor="middle" style="font-size:16px">Scarcity price</text><text class="fg-s" x="764" y="246" text-anchor="middle">rises when demand nears limit</text></g><path id="p233669" d="M750,156 L750,194" class="fg-ln fg-flow" stroke="var(--water,#2470a8)"/><path d="M744.7804135906653,183.19463477176788 L750,194 L755.2195864093347,183.19463477176788" class="fg-ln" stroke="var(--water,#2470a8)"/><circle r="6" fill="var(--water,#2470a8)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p233669"/></animateMotion></circle></svg>
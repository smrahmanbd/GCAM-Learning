<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Transport nesting tree"><title>Transport nesting tree</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Passenger travel in GCAM, nest by nest</text><text class="fg-s" x="24" y="54">Service demand splits by mode, then size class, then technology, each by a logit on cost</text><g class=""><rect class="fg-box" x="340.0" y="53.0" width="220" height="54" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6M16 4.5a3.2 3.2 0 0 1 0 6.2M18 14.3c2 .8 3.3 2.9 3.6 5.7" transform="translate(353.0,67.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="464" y="76" text-anchor="middle" style="font-size:16px">Passenger-km</text><text class="fg-s" x="464" y="96" text-anchor="middle">set by income and price</text></g><g class=""><rect class="fg-box" x="115.0" y="153.0" width="130" height="54" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M5 16h14M3 16v-3l2-5h14l2 5v3h-2M5 16H3M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" transform="translate(128.0,167.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="194" y="185" text-anchor="middle" style="font-size:16px">Car</text></g><g class=""><rect class="fg-box" x="295.0" y="153.0" width="130" height="54" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M2 6h11v10H2zM13 10h4l4 4v2h-8M6 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" transform="translate(308.0,167.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="374" y="185" text-anchor="middle" style="font-size:16px">Bus</text></g><g class=""><rect class="fg-box" x="475.0" y="153.0" width="130" height="54" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M3 6l6-3 6 3 6-3v15l-6 3-6-3-6 3zM9 3v15M15 6v15" transform="translate(488.0,167.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="554" y="185" text-anchor="middle" style="font-size:16px">Rail</text></g><g class=""><rect class="fg-box" x="655.0" y="153.0" width="130" height="54" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M2 13l20-8-6 15-4-6-6 3 1-5z" transform="translate(668.0,167.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="734" y="185" text-anchor="middle" style="font-size:16px">Air</text></g><path id="p975696" d="M450,108 L180,152" class="fg-ln fg-flow" stroke="var(--energy,#b8790f)"/><path d="M189.8251578206295,145.1104228141545 L180,152 L191.50420724676414,155.4136806563443" class="fg-ln" stroke="var(--energy,#b8790f)"/><circle r="6" fill="var(--energy,#b8790f)"><animateMotion dur="1.4s" repeatCount="indefinite"><mpath href="#p975696"/></animateMotion></circle><path id="p250606" d="M450,108 L360,152" class="fg-ln fg-flow" stroke="var(--energy,#b8790f)"/><path d="M367.41487589920877,142.56497931113378 L360,152 L371.999866370919,151.94336891235932" class="fg-ln" stroke="var(--energy,#b8790f)"/><circle r="6" fill="var(--energy,#b8790f)"><animateMotion dur="1.7s" repeatCount="indefinite"><mpath href="#p250606"/></animateMotion></circle><path id="p36819" d="M450,108 L540,152" class="fg-ln fg-flow" stroke="var(--energy,#b8790f)"/><path d="M528.000133629081,151.94336891235932 L540,152 L532.5851241007913,142.56497931113378" class="fg-ln" stroke="var(--energy,#b8790f)"/><circle r="6" fill="var(--energy,#b8790f)"><animateMotion dur="2.0s" repeatCount="indefinite"><mpath href="#p36819"/></animateMotion></circle><path id="p823032" d="M450,108 L720,152" class="fg-ln fg-flow" stroke="var(--energy,#b8790f)"/><path d="M708.4957927532358,155.4136806563443 L720,152 L710.1748421793704,145.1104228141545" class="fg-ln" stroke="var(--energy,#b8790f)"/><circle r="6" fill="var(--energy,#b8790f)"><animateMotion dur="2.3s" repeatCount="indefinite"><mpath href="#p823032"/></animateMotion></circle><g class=""><rect class="fg-box" x="45.0" y="265.0" width="110" height="50" rx="14" stroke="var(--climate,#a8323e)" fill="var(--card,#ffffff)"/><text class="fg-h" x="100" y="295" text-anchor="middle" style="font-size:16px">ICE</text></g><g class=""><rect class="fg-box" x="175.0" y="265.0" width="110" height="50" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><text class="fg-h" x="230" y="295" text-anchor="middle" style="font-size:16px">Hybrid</text></g><g class=""><rect class="fg-box" x="305.0" y="265.0" width="110" height="50" rx="14" stroke="var(--water,#2470a8)" fill="var(--card,#ffffff)"/><text class="fg-h" x="360" y="295" text-anchor="middle" style="font-size:16px">Battery EV</text></g><g class=""><rect class="fg-box" x="435.0" y="265.0" width="110" height="50" rx="14" stroke="var(--land,#4e7f2f)" fill="var(--card,#ffffff)"/><text class="fg-h" x="490" y="295" text-anchor="middle" style="font-size:16px">Hydrogen</text></g><path id="p809946" d="M180,208 L100,264" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M105.85886384893018,253.5274781260816 L100,264 L111.84533636673834,262.0795817229504" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><circle r="6" fill="var(--ink-soft,#3d5263)"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p809946"/></animateMotion></circle><path id="p875059" d="M180,208 L230,264" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M218.90997028402228,259.4161979865257 L230,264 L226.69694244568944,252.46354427075144" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><circle r="6" fill="var(--ink-soft,#3d5263)"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p875059"/></animateMotion></circle><path id="p35341" d="M180,208 L360,264" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M348.13185925028546,265.7740448542709 L360,264 L351.2329883319016,255.80612994907617" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><circle r="6" fill="var(--ink-soft,#3d5263)"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p35341"/></animateMotion></circle><path id="p691662" d="M180,208 L490,264" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M478.43886284398735,267.2156037784316 L490,264 L480.2946129289329,256.94270152248305" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><circle r="6" fill="var(--ink-soft,#3d5263)"><animateMotion dur="1.8s" repeatCount="indefinite"><mpath href="#p691662"/></animateMotion></circle><text class="fg-s" x="720" y="285" text-anchor="middle">cost per pkm = vehicle cost ÷ load factor</text><text class="fg-s" x="720" y="305" text-anchor="middle">+ value of time for each mode</text></svg>
<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How AIM-Hub works"><title>How AIM-Hub works</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">AIM-Hub (AIM/CGE): the whole economy in general equilibrium</text><text class="fg-s" x="24" y="54">Every market clears, including labour and capital; recursive dynamic, one-year steps</text><circle cx="300" cy="200" r="120" fill="none" stroke="var(--line,#d3dde3)" stroke-width="18"/><g class=""><rect class="fg-box" x="215.0" y="62.0" width="170" height="56" rx="14" stroke="var(--economy,#5a4e8c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6M16 4.5a3.2 3.2 0 0 1 0 6.2M18 14.3c2 .8 3.3 2.9 3.6 5.7" transform="translate(228.0,77.0) scale(1.0833333333333333)" stroke="var(--economy,#5a4e8c)" stroke-width="2.03"/><text class="fg-h" x="314" y="95" text-anchor="middle" style="font-size:16px">Households</text></g><g class=""><rect class="fg-box" x="215.0" y="282.0" width="170" height="56" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M2 21V10l6 4V10l6 4V6h4l1-3h1v18zM6 18h2M11 18h2M16 18h2" transform="translate(228.0,297.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="314" y="315" text-anchor="middle" style="font-size:16px">Firms (sectors)</text></g><path id="aimL" d="M200,240 A120,120 0 0 1 200,160" fill="none"/><path id="aimR" d="M400,160 A120,120 0 0 1 400,240" fill="none"/><circle r="7" fill="var(--economy,#5a4e8c)"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M300,118 A120,120 0 0 1 300,282"/></circle><circle r="7" fill="var(--energy,#b8790f)"><animateMotion dur="3s" begin="0s" repeatCount="indefinite" path="M300,282 A120,120 0 0 1 300,118"/></circle><circle r="7" fill="var(--economy,#5a4e8c)"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M300,118 A120,120 0 0 1 300,282"/></circle><circle r="7" fill="var(--energy,#b8790f)"><animateMotion dur="3s" begin="1s" repeatCount="indefinite" path="M300,282 A120,120 0 0 1 300,118"/></circle><circle r="7" fill="var(--economy,#5a4e8c)"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M300,118 A120,120 0 0 1 300,282"/></circle><circle r="7" fill="var(--energy,#b8790f)"><animateMotion dur="3s" begin="2s" repeatCount="indefinite" path="M300,282 A120,120 0 0 1 300,118"/></circle><text class="fg-s" x="440" y="205">goods</text><text class="fg-s" x="120" y="205">labour, capital</text><g class=""><rect class="fg-box" x="565.0" y="108.0" width="270" height="64" rx="14" stroke="var(--policy,#3d5a6c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 3v18M7 21h10M4 7h16M6 7l-3 7a3 3 0 0 0 6 0L6 7zM18 7l-3 7a3 3 0 0 0 6 0l-3-7z" transform="translate(578.0,127.0) scale(1.0833333333333333)" stroke="var(--policy,#3d5a6c)" stroke-width="2.03"/><text class="fg-h" x="714" y="136" text-anchor="middle" style="font-size:16px">Carbon tax</text><text class="fg-s" x="714" y="156" text-anchor="middle">raises costs, revenue recycled</text></g><g class=""><rect class="fg-box" x="565.0" y="218.0" width="270" height="64" rx="14" stroke="var(--land,#4e7f2f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M4 20V10M10 20V4M16 20v-7M22 20H2" transform="translate(578.0,237.0) scale(1.0833333333333333)" stroke="var(--land,#4e7f2f)" stroke-width="2.03"/><text class="fg-h" x="714" y="246" text-anchor="middle" style="font-size:16px">GDP loss emerges</text><text class="fg-s" x="714" y="266" text-anchor="middle">from the whole economy</text></g></svg>
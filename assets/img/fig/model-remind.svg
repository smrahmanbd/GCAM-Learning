<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How REMIND solves"><title>How REMIND solves</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">REMIND: a planner maximises welfare over the whole century</text><text class="fg-s" x="24" y="54">Intertemporal Ramsey growth model, perfect foresight, coupled to MAgPIE (land) and EDGE-T (transport)</text><line x1="80" y1="300" x2="560" y2="300" stroke="var(--ink,#14283a)" stroke-width="2"/><rect x="90" y="240" width="34" height="60" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="90" y="216" width="34" height="24" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="136" y="232" width="34" height="68" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="136" y="210" width="34" height="22" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="182" y="224" width="34" height="76" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="182" y="204" width="34" height="20" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="228" y="216" width="34" height="84" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="228" y="198" width="34" height="18" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="274" y="208" width="34" height="92" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="274" y="192" width="34" height="16" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="320" y="200" width="34" height="100" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="320" y="186" width="34" height="14" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="366" y="192" width="34" height="108" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="366" y="180" width="34" height="12" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="412" y="184" width="34" height="116" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="412" y="174" width="34" height="10" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="458" y="176" width="34" height="124" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="458" y="168" width="34" height="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><rect x="504" y="168" width="34" height="132" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)"/><rect x="504" y="162" width="34" height="6" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)"/><text class="fg-s" x="320" y="320" text-anchor="middle">consumption (purple) and energy investment (gold) per period</text><path d="M560,120 C450,60 220,60 110,120" class="fg-ln fg-flow" stroke="var(--policy,#3d5a6c)"/><text class="fg-s" x="335" y="70" text-anchor="middle">foresight: 2100 informs today</text><g class=""><rect class="fg-box" x="620.0" y="90.0" width="240" height="60" rx="14" stroke="var(--economy,#5a4e8c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 16a4 4 0 1 0 0-8 4 4 0 0 0 0 8zM12 12h.01" transform="translate(633.0,107.0) scale(1.0833333333333333)" stroke="var(--economy,#5a4e8c)" stroke-width="2.03"/><text class="fg-h" x="754" y="116" text-anchor="middle" style="font-size:16px">Max Σ discounted utility</text><text class="fg-s" x="754" y="136" text-anchor="middle">of consumption</text></g><g class=""><rect class="fg-box" x="620.0" y="190.0" width="240" height="60" rx="14" stroke="var(--land,#4e7f2f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19c3-4 6-6 10-8" transform="translate(633.0,207.0) scale(1.0833333333333333)" stroke="var(--land,#4e7f2f)" stroke-width="2.03"/><text class="fg-h" x="754" y="216" text-anchor="middle" style="font-size:16px">MAgPIE ↔ REMIND</text><text class="fg-s" x="754" y="236" text-anchor="middle">soft-linked land</text></g><g class=""><rect class="fg-box" x="620.0" y="285.0" width="240" height="50" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M5 16h14M3 16v-3l2-5h14l2 5v3h-2M5 16H3M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" transform="translate(633.0,297.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="754" y="306" text-anchor="middle" style="font-size:16px">EDGE-T</text><text class="fg-s" x="754" y="326" text-anchor="middle">transport (GCAM fork)</text></g></svg>
<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Downscaling"><title>Downscaling</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Going finer: downscaling and coupling</text><text class="fg-s" x="24" y="54">Split a GCAM region's results into countries, or link GCAM to a fleet or grid model</text><rect x="80" y="110" width="260" height="180" rx="14" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="3" class="fg-pulse"/><text class="fg-h" x="210" y="205" text-anchor="middle">GCAM region</text><path id="p479595" d="M350,200 L440,200" class="fg-ln fg-flow" stroke="var(--energy,#b8790f)"/><path d="M429.1946347717679,205.21958640933477 L440,200 L429.1946347717679,194.78041359066523" class="fg-ln" stroke="var(--energy,#b8790f)"/><circle r="6" fill="var(--energy,#b8790f)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p479595"/></animateMotion></circle><rect x="460" y="110" width="80" height="82" rx="10" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:0.0s"/><text class="fg-s" x="500" y="156" text-anchor="middle">country 1</text><rect x="550" y="110" width="80" height="82" rx="10" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:0.25s"/><text class="fg-s" x="590" y="156" text-anchor="middle">country 2</text><rect x="640" y="110" width="80" height="82" rx="10" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:0.5s"/><text class="fg-s" x="680" y="156" text-anchor="middle">country 3</text><rect x="460" y="202" width="80" height="82" rx="10" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:0.75s"/><text class="fg-s" x="500" y="248" text-anchor="middle">country 4</text><rect x="550" y="202" width="80" height="82" rx="10" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:1.0s"/><text class="fg-s" x="590" y="248" text-anchor="middle">country 5</text><rect x="640" y="202" width="80" height="82" rx="10" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:1.25s"/><text class="fg-s" x="680" y="248" text-anchor="middle">country 6</text><g class=""><rect class="fg-box" x="725.0" y="110.0" width="150" height="60" rx="14" stroke="var(--land,#4e7f2f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M5 16h14M3 16v-3l2-5h14l2 5v3h-2M5 16H3M7 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4zM17 19a2 2 0 1 0 0-4 2 2 0 0 0 0 4z" transform="translate(738.0,127.0) scale(1.0833333333333333)" stroke="var(--land,#4e7f2f)" stroke-width="2.03"/><text class="fg-h" x="814" y="136" text-anchor="middle" style="font-size:16px">Fleet model</text><text class="fg-s" x="814" y="156" text-anchor="middle">stock, ages</text></g><g class=""><rect class="fg-box" x="725.0" y="230.0" width="150" height="60" rx="14" stroke="var(--policy,#3d5a6c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" transform="translate(738.0,247.0) scale(1.0833333333333333)" stroke="var(--policy,#3d5a6c)" stroke-width="2.03"/><text class="fg-h" x="814" y="256" text-anchor="middle" style="font-size:16px">Grid model</text><text class="fg-s" x="814" y="276" text-anchor="middle">hours, peaks</text></g><path id="p273977" d="M800,172 L800,228" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M794.7804135906653,217.19463477176788 L800,228 L805.2195864093347,217.19463477176788" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><circle r="6" fill="var(--ink-soft,#3d5263)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p273977"/></animateMotion></circle></svg>
<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="An integrated assessment model as a mobile"><title>An integrated assessment model as a mobile</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Integrated: tap one part and every part moves</text><text class="fg-s" x="24" y="54">An IAM keeps economy, energy, land, water and climate in one consistent calculation</text><g class="fg-swing" style="transform-origin:450px 70px"><line x1="450" y1="70" x2="450" y2="100" stroke="var(--ink,#14283a)" stroke-width="3"/><line x1="130" y1="100" x2="770" y2="100" stroke="var(--ink,#14283a)" stroke-width="4" stroke-linecap="round"/><line x1="150" y1="100" x2="150" y2="180" stroke="var(--ink-soft,#3d5263)" stroke-width="2"/><g class="fg-pulse" style="animation-delay:0.0s"><circle cx="150" cy="220" r="40" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="3"/><path class="fg-ic " d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6M16 4.5a3.2 3.2 0 0 1 0 6.2M18 14.3c2 .8 3.3 2.9 3.6 5.7" transform="translate(135.0,199.0) scale(1.25)" stroke="var(--economy,#5a4e8c)" stroke-width="1.76"/><text class="fg-s" x="150" y="246" text-anchor="middle">Economy</text></g><line x1="300" y1="100" x2="300" y2="220" stroke="var(--ink-soft,#3d5263)" stroke-width="2"/><g class="fg-pulse" style="animation-delay:0.3s"><circle cx="300" cy="260" r="40" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="3"/><path class="fg-ic " d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" transform="translate(285.0,239.0) scale(1.25)" stroke="var(--energy,#b8790f)" stroke-width="1.76"/><text class="fg-s" x="300" y="286" text-anchor="middle">Energy</text></g><line x1="450" y1="100" x2="450" y2="170" stroke="var(--ink-soft,#3d5263)" stroke-width="2"/><g class="fg-pulse" style="animation-delay:0.6s"><circle cx="450" cy="210" r="40" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="3"/><path class="fg-ic " d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19c3-4 6-6 10-8" transform="translate(435.0,189.0) scale(1.25)" stroke="var(--land,#4e7f2f)" stroke-width="1.76"/><text class="fg-s" x="450" y="236" text-anchor="middle">Land</text></g><line x1="600" y1="100" x2="600" y2="220" stroke="var(--ink-soft,#3d5263)" stroke-width="2"/><g class="fg-pulse" style="animation-delay:0.8999999999999999s"><circle cx="600" cy="260" r="40" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="3"/><path class="fg-ic " d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" transform="translate(585.0,239.0) scale(1.25)" stroke="var(--water,#2470a8)" stroke-width="1.76"/><text class="fg-s" x="600" y="286" text-anchor="middle">Water</text></g><line x1="750" y1="100" x2="750" y2="180" stroke="var(--ink-soft,#3d5263)" stroke-width="2"/><g class="fg-pulse" style="animation-delay:1.2s"><circle cx="750" cy="220" r="40" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" stroke-width="3"/><path class="fg-ic " d="M10 14V5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0zM12 9v7" transform="translate(735.0,199.0) scale(1.25)" stroke="var(--climate,#a8323e)" stroke-width="1.76"/><text class="fg-s" x="750" y="246" text-anchor="middle">Climate</text></g></g><text class="fg-t" x="450" y="345" text-anchor="middle">A what-if machine: you choose the assumptions, it returns a world that adds up.</text></svg>
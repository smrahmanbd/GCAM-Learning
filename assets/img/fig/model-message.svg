<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How MESSAGEix solves"><title>How MESSAGEix solves</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">MESSAGEix: one big linear programme with perfect foresight</text><text class="fg-s" x="24" y="54">Choose every technology in every period at once to meet demand at least total discounted cost</text><line x1="80" y1="310" x2="460" y2="310" stroke="var(--ink,#14283a)" stroke-width="2"/><line x1="80" y1="310" x2="80" y2="80" stroke="var(--ink,#14283a)" stroke-width="2"/><text class="fg-s" x="400" y="330">coal power</text><text class="fg-s" x="20" y="90">solar</text><polygon points="80,310 80,150 200,110 380,190 430,310" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2"/><text class="fg-s" x="200" y="250" text-anchor="middle">feasible: meets demand,</text><text class="fg-s" x="200" y="266" text-anchor="middle">respects the CO2 cap</text><g><animateTransform attributeName="transform" type="translate" values="-160 160;0 0;0 0;-160 160" keyTimes="0;.5;.85;1" dur="6s" repeatCount="indefinite"/><line x1="80" y1="40" x2="420" y2="260" stroke="var(--climate,#a8323e)" stroke-width="3" stroke-dasharray="8 6" transform="translate(-40,-40)"/></g><circle cx="200" cy="110" r="10" fill="var(--climate,#a8323e)" class="fg-pulse"/><text class="fg-s" x="215" y="100">least-cost corner</text><g class=""><rect class="fg-box" x="560.0" y="88.0" width="280" height="64" rx="14" stroke="var(--water,#2470a8)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 3" transform="translate(573.0,107.0) scale(1.0833333333333333)" stroke="var(--water,#2470a8)" stroke-width="2.03"/><text class="fg-h" x="714" y="116" text-anchor="middle" style="font-size:16px">Sees 2100 from 2020</text><text class="fg-s" x="714" y="136" text-anchor="middle">invests early if cheaper overall</text></g><g class=""><rect class="fg-box" x="560.0" y="208.0" width="280" height="64" rx="14" stroke="var(--policy,#3d5a6c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15 9c-.5-1-1.6-1.5-3-1.5-1.8 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.5 0-2.6-.6-3-1.6M12 6v1.5M12 16.5V18" transform="translate(573.0,227.0) scale(1.0833333333333333)" stroke="var(--policy,#3d5a6c)" stroke-width="2.03"/><text class="fg-h" x="714" y="236" text-anchor="middle" style="font-size:16px">Shadow price of CO2 cap</text><text class="fg-s" x="714" y="256" text-anchor="middle">= the carbon price</text></g></svg>
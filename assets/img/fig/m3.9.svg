<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="IAM family map"><title>IAM family map</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Seven integrated assessment models, two big choices</text><text class="fg-s" x="24" y="54">How far each model sees ahead (foresight) and how much of the economy it covers</text><line x1="120" y1="320" x2="820" y2="320" stroke="var(--ink,#14283a)" stroke-width="2"/><line x1="120" y1="320" x2="120" y2="70" stroke="var(--ink,#14283a)" stroke-width="2"/><text class="fg-s" x="650" y="345">foresight: myopic → perfect</text><text class="fg-s" x="20" y="80">economy:</text><text class="fg-s" x="20" y="96">whole</text><text class="fg-s" x="20" y="310">energy + land</text><g class="fg-pop" style="animation-delay:0.0s"><circle cx="200" cy="260" r="40" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="3"/><text class="fg-h" x="200" y="265" text-anchor="middle" style="font-size:12px">GCAM</text></g><g class="fg-pop" style="animation-delay:0.3s"><circle cx="330" cy="245" r="40" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="3"/><text class="fg-h" x="330" y="250" text-anchor="middle" style="font-size:12px">IMAGE</text></g><g class="fg-pop" style="animation-delay:0.6s"><circle cx="250" cy="130" r="40" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="3"/><text class="fg-h" x="250" y="135" text-anchor="middle" style="font-size:12px">AIM-Hub</text></g><g class="fg-pop" style="animation-delay:0.8999999999999999s"><circle cx="600" cy="220" r="40" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="3"/><text class="fg-h" x="600" y="225" text-anchor="middle" style="font-size:12px">MESSAGEix</text></g><g class="fg-pop" style="animation-delay:1.2s"><circle cx="700" cy="120" r="40" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)" stroke-width="3"/><text class="fg-h" x="700" y="125" text-anchor="middle" style="font-size:12px">REMIND</text></g><g class="fg-pop" style="animation-delay:1.5s"><circle cx="760" cy="200" r="40" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" stroke-width="3"/><text class="fg-h" x="760" y="205" text-anchor="middle" style="font-size:12px">WITCH</text></g><g class="fg-pop" style="animation-delay:1.7999999999999998s"><circle cx="560" cy="100" r="40" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="3"/><text class="fg-h" x="560" y="105" text-anchor="middle" style="font-size:12px">DICE</text></g></svg>
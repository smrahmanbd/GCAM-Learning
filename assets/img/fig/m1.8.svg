<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Marginal abatement cost curve"><title>Marginal abatement cost curve</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">The marginal abatement cost curve</text><text class="fg-s" x="24" y="54">Each bar is an option: width = tonnes it can cut, height = cost per tonne; a carbon price buys everything below it</text><line x1="80" y1="250" x2="800" y2="250" stroke="var(--ink,#14283a)" stroke-width="2"/><line x1="80" y1="90" x2="80" y2="330" stroke="var(--ink,#14283a)" stroke-width="2"/><text class="fg-s" x="20" y="100">$ per t</text><text class="fg-s" x="720" y="275">tonnes cut →</text><rect class="fg-grow" style="animation-delay:0.0s;transform-origin:top" x="82" y="250" width="110" height="30" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><text class="fg-s" x="137.0" y="296" text-anchor="middle">efficiency</text><rect class="fg-grow" style="animation-delay:0.25s;transform-origin:bottom" x="192" y="235" width="70" height="15" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><text class="fg-s" x="227.0" y="229" text-anchor="middle">methane</text><rect class="fg-grow" style="animation-delay:0.5s;transform-origin:bottom" x="262" y="215" width="170" height="35" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2"/><text class="fg-s" x="347.0" y="209" text-anchor="middle">wind, solar</text><rect class="fg-grow" style="animation-delay:0.75s;transform-origin:bottom" x="432" y="180" width="90" height="70" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2"/><text class="fg-s" x="477.0" y="174" text-anchor="middle">EVs</text><rect class="fg-grow" style="animation-delay:1.0s;transform-origin:bottom" x="522" y="150" width="100" height="100" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="2"/><text class="fg-s" x="572.0" y="144" text-anchor="middle">industry</text><rect class="fg-grow" style="animation-delay:1.25s;transform-origin:bottom" x="622" y="125" width="80" height="125" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)" stroke-width="2"/><text class="fg-s" x="662.0" y="119" text-anchor="middle">CCS</text><rect class="fg-grow" style="animation-delay:1.5s;transform-origin:bottom" x="702" y="100" width="90" height="150" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" stroke-width="2"/><text class="fg-s" x="747.0" y="94" text-anchor="middle">air capture</text><g><animateTransform attributeName="transform" type="translate" values="0 0;0 -110;0 -110;0 0" keyTimes="0;.45;.8;1" dur="7s" repeatCount="indefinite"/><line x1="80" y1="245" x2="820" y2="245" stroke="var(--climate,#a8323e)" stroke-width="3" stroke-dasharray="8 6"/><text class="fg-t" x="820" y="238" text-anchor="end" style="fill:var(--climate,#a8323e)">carbon price</text></g></svg>
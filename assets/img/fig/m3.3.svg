<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Literature evidence map"><title>Literature evidence map</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Many studies, one evidence map</text><text class="fg-s" x="24" y="54">Place your question: where do models agree, disagree, or stay silent?</text><rect x="90" y="140" width="28" height="170" rx="3" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="2"/><rect x="124" y="148" width="28" height="162" rx="3" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2"/><rect x="158" y="156" width="28" height="154" rx="3" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><rect x="192" y="140" width="28" height="170" rx="3" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2"/><rect x="226" y="148" width="28" height="162" rx="3" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" stroke-width="2"/><rect x="260" y="156" width="28" height="154" rx="3" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)" stroke-width="2"/><rect x="294" y="140" width="28" height="170" rx="3" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="2"/><rect x="328" y="148" width="28" height="162" rx="3" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2"/><line x1="420" y1="320" x2="860" y2="320" stroke="var(--ink,#14283a)" stroke-width="2"/><rect x="420" y="170" width="440" height="60" fill="var(--land-t,#e6f0dd)"/><text class="fg-s" x="430" y="165">range where most studies agree</text><circle cx="440" cy="144.0" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:0.0s"/><circle cx="474" cy="203.2" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:0.2s"/><circle cx="508" cy="150.4" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:0.4s"/><circle cx="542" cy="209.6" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:0.6000000000000001s"/><circle cx="576" cy="156.8" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:0.8s"/><circle cx="610" cy="216.0" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:1.0s"/><circle cx="644" cy="163.2" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:1.2000000000000002s"/><circle cx="678" cy="222.4" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:1.4000000000000001s"/><circle cx="712" cy="169.6" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:1.6s"/><circle cx="746" cy="228.8" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:1.8s"/><circle cx="780" cy="176.0" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:2.0s"/><circle cx="814" cy="235.2" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:2.2s"/><circle cx="848" cy="182.4" r="8" fill="var(--energy,#b8790f)" class="fg-pop" style="animation-delay:2.4000000000000004s"/><text class="fg-t" x="640" y="345" text-anchor="middle">each dot = one model estimate of 2050 transport CO2</text></svg>
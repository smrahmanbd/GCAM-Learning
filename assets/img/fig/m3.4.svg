<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Scenario design matrix"><title>Scenario design matrix</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Design before you run</text><text class="fg-s" x="24" y="54">Rows: transport levers. Columns: policy. Each filled cell is one run in your batch</text><text class="fg-s" x="260" y="100" text-anchor="middle">Reference</text><text class="fg-s" x="390" y="100" text-anchor="middle">Carbon tax</text><text class="fg-s" x="520" y="100" text-anchor="middle">Net-zero cap</text><text class="fg-s" x="650" y="100" text-anchor="middle">ZEV standard</text><text class="fg-s" x="180" y="150" text-anchor="end">Core</text><text class="fg-s" x="180" y="210" text-anchor="end">Cheap batteries</text><text class="fg-s" x="180" y="270" text-anchor="end">Fuller vehicles</text><text class="fg-s" x="180" y="330" text-anchor="end">Both</text><rect x="200" y="120" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:0.0s"/><rect x="330" y="120" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:0.18s"/><rect x="460" y="120" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:0.36s"/><rect x="590" y="120" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:0.54s"/><rect x="200" y="180" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:0.72s"/><rect x="330" y="180" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:0.8999999999999999s"/><rect x="460" y="180" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:1.08s"/><rect x="590" y="180" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:1.26s"/><rect x="200" y="240" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:1.44s"/><rect x="330" y="240" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:1.6199999999999999s"/><rect x="460" y="240" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:1.7999999999999998s"/><rect x="590" y="240" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:1.98s"/><rect x="200" y="300" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:2.16s"/><rect x="330" y="300" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:2.34s"/><rect x="460" y="300" width="120" height="50" rx="8" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="2" class="fg-pop" style="animation-delay:2.52s"/><rect x="590" y="300" width="120" height="50" rx="8" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="2" class="fg-pop" style="animation-delay:2.6999999999999997s"/><g class=""><rect class="fg-box" x="715.0" y="175.0" width="150" height="70" rx="14" stroke="var(--economy,#5a4e8c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M3 3h18v18H3zM3 9h18M3 15h18M9 3v18M15 3v18" transform="translate(728.0,197.0) scale(1.0833333333333333)" stroke="var(--economy,#5a4e8c)" stroke-width="2.03"/><text class="fg-h" x="804" y="206" text-anchor="middle" style="font-size:16px">16 runs</text><text class="fg-s" x="804" y="226" text-anchor="middle">+ uncertainty plan</text></g></svg>
<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Writing up checklist"><title>Writing up checklist</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">Limits, ethics and a reproducible paper</text><text class="fg-s" x="24" y="54">State what the model cannot see, whose costs count, and how to rebuild every number</text><rect x="100" y="80" width="260" height="250" rx="12" fill="var(--card,#ffffff)" stroke="var(--ink,#14283a)" stroke-width="2"/><path class="fg-ic " d="M4 20h4L19 9l-4-4L4 16zM14 6l4 4" transform="translate(317.0,97.0) scale(1.0833333333333333)" stroke="var(--ink,#14283a)" stroke-width="2.03"/><g class="fg-pop" style="animation-delay:0.0s"><circle cx="135" cy="130" r="12" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><path d="M129,130 l5,5 l9,-10" class="fg-ln" stroke="var(--land,#4e7f2f)"/></g><text class="fg-t" x="160" y="135">GCAM version and config</text><g class="fg-pop" style="animation-delay:0.45s"><circle cx="135" cy="175" r="12" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><path d="M129,175 l5,5 l9,-10" class="fg-ln" stroke="var(--land,#4e7f2f)"/></g><text class="fg-t" x="160" y="180">Limits stated</text><g class="fg-pop" style="animation-delay:0.9s"><circle cx="135" cy="220" r="12" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><path d="M129,220 l5,5 l9,-10" class="fg-ln" stroke="var(--land,#4e7f2f)"/></g><text class="fg-t" x="160" y="225">Who gains, who pays</text><g class="fg-pop" style="animation-delay:1.35s"><circle cx="135" cy="265" r="12" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><path d="M129,265 l5,5 l9,-10" class="fg-ln" stroke="var(--land,#4e7f2f)"/></g><text class="fg-t" x="160" y="270">IAMC-format results</text><g class="fg-pop" style="animation-delay:1.8s"><circle cx="135" cy="310" r="12" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="2"/><path d="M129,310 l5,5 l9,-10" class="fg-ln" stroke="var(--land,#4e7f2f)"/></g><text class="fg-t" x="160" y="315">Code and data archived</text><g class=""><rect class="fg-box" x="490.0" y="105.0" width="300" height="70" rx="14" stroke="var(--climate,#a8323e)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 3l10 18H2zM12 10v5M12 18h.01" transform="translate(503.0,127.0) scale(1.0833333333333333)" stroke="var(--climate,#a8323e)" stroke-width="2.03"/><text class="fg-h" x="654" y="136" text-anchor="middle" style="font-size:16px">What GCAM cannot see</text><text class="fg-s" x="654" y="156" text-anchor="middle">fleets, congestion, behaviour</text></g><g class=""><rect class="fg-box" x="490.0" y="225.0" width="300" height="70" rx="14" stroke="var(--economy,#5a4e8c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 3v18M7 21h10M4 7h16M6 7l-3 7a3 3 0 0 0 6 0L6 7zM18 7l-3 7a3 3 0 0 0 6 0l-3-7z" transform="translate(503.0,247.0) scale(1.0833333333333333)" stroke="var(--economy,#5a4e8c)" stroke-width="2.03"/><text class="fg-h" x="654" y="256" text-anchor="middle" style="font-size:16px">Whose future?</text><text class="fg-s" x="654" y="276" text-anchor="middle">equity across regions</text></g></svg>
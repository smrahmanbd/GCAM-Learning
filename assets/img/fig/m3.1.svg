<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GCAM research pipeline"><title>GCAM research pipeline</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">GCAM as research software</text><text class="fg-s" x="24" y="54">Raw data → gcamdata → XML inputs → the solver → database → queries and analysis</text><g class=""><rect class="fg-box" x="40.0" y="150.0" width="120" height="80" rx="14" stroke="var(--economy,#5a4e8c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" transform="translate(53.0,177.0) scale(1.0833333333333333)" stroke="var(--economy,#5a4e8c)" stroke-width="2.03"/><text class="fg-h" x="114" y="186" text-anchor="middle" style="font-size:16px">Raw data</text><text class="fg-s" x="114" y="206" text-anchor="middle">csv</text></g><g class=""><rect class="fg-box" x="180.0" y="150.0" width="120" height="80" rx="14" stroke="var(--economy,#5a4e8c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M8 7l-5 5 5 5M16 7l5 5-5 5M14 4l-4 16" transform="translate(193.0,177.0) scale(1.0833333333333333)" stroke="var(--economy,#5a4e8c)" stroke-width="2.03"/><text class="fg-h" x="254" y="186" text-anchor="middle" style="font-size:16px">gcamdata</text><text class="fg-s" x="254" y="206" text-anchor="middle">R package</text></g><g class=""><rect class="fg-box" x="320.0" y="150.0" width="120" height="80" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 3l9 5-9 5-9-5 9-5zM3 13l9 5 9-5M3 17.5l9 5 9-5" transform="translate(333.0,177.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="394" y="186" text-anchor="middle" style="font-size:16px">XML</text><text class="fg-s" x="394" y="206" text-anchor="middle">inputs</text></g><g class=""><rect class="fg-box" x="460.0" y="150.0" width="120" height="80" rx="14" stroke="var(--policy,#3d5a6c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" transform="translate(473.0,177.0) scale(1.0833333333333333)" stroke="var(--policy,#3d5a6c)" stroke-width="2.03"/><text class="fg-h" x="534" y="186" text-anchor="middle" style="font-size:16px">Solver</text><text class="fg-s" x="534" y="206" text-anchor="middle">clears markets</text></g><g class=""><rect class="fg-box" x="600.0" y="150.0" width="120" height="80" rx="14" stroke="var(--water,#2470a8)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M4 6c0-1.7 3.6-3 8-3s8 1.3 8 3-3.6 3-8 3-8-1.3-8-3zM4 6v6c0 1.7 3.6 3 8 3s8-1.3 8-3V6M4 12v6c0 1.7 3.6 3 8 3s8-1.3 8-3v-6" transform="translate(613.0,177.0) scale(1.0833333333333333)" stroke="var(--water,#2470a8)" stroke-width="2.03"/><text class="fg-h" x="674" y="186" text-anchor="middle" style="font-size:16px">Database</text><text class="fg-s" x="674" y="206" text-anchor="middle">results</text></g><g class=""><rect class="fg-box" x="740.0" y="150.0" width="120" height="80" rx="14" stroke="var(--land,#4e7f2f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M4 20V10M10 20V4M16 20v-7M22 20H2" transform="translate(753.0,177.0) scale(1.0833333333333333)" stroke="var(--land,#4e7f2f)" stroke-width="2.03"/><text class="fg-h" x="814" y="186" text-anchor="middle" style="font-size:16px">Analysis</text><text class="fg-s" x="814" y="206" text-anchor="middle">R / Python</text></g><path id="p545351" d="M160,190 L180,190" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M169.19463477176788,195.21958640933477 L180,190 L169.19463477176788,184.78041359066523" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><path id="p303600" d="M300,190 L320,190" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M309.1946347717679,195.21958640933477 L320,190 L309.1946347717679,184.78041359066523" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><path id="p246536" d="M440,190 L460,190" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M449.1946347717679,195.21958640933477 L460,190 L449.1946347717679,184.78041359066523" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><path id="p229194" d="M580,190 L600,190" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M589.1946347717678,195.21958640933477 L600,190 L589.1946347717678,184.78041359066523" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><path id="p690491" d="M720,190 L740,190" class="fg-ln fg-flow" stroke="var(--ink-soft,#3d5263)"/><path d="M729.1946347717678,195.21958640933477 L740,190 L729.1946347717678,184.78041359066523" class="fg-ln" stroke="var(--ink-soft,#3d5263)"/><circle r="9" fill="var(--energy,#b8790f)"><animateMotion dur="6s" repeatCount="indefinite" path="M40,190 L860,190"/></circle><g class="fg-spin" style="transform-origin:520px 190px;animation-duration:4s;opacity:.25"><path class="fg-ic " d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6zM12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9 7 7M17 17l2.1 2.1M4.9 19.1 7 17M17 7l2.1-2.1" transform="translate(465.0,135.0) scale(4.583333333333333)" stroke="var(--policy,#3d5a6c)" stroke-width="0.48"/></g><text class="fg-t" x="450" y="300" text-anchor="middle">Reproducible means anyone can rebuild every step: version, inputs, config and queries.</text></svg>
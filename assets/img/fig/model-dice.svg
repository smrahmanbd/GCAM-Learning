<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How DICE works"><title>How DICE works</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">DICE: weigh the cost of cutting against the damage avoided</text><text class="fg-s" x="24" y="54">One world region, optimal growth; the optimum is where marginal cost = marginal benefit</text><line x1="100" y1="310" x2="600" y2="310" stroke="var(--ink,#14283a)" stroke-width="2"/><line x1="100" y1="310" x2="100" y2="70" stroke="var(--ink,#14283a)" stroke-width="2"/><text class="fg-s" x="470" y="332">share of emissions cut</text><path d="M100,305 C300,300 450,230 590,80" class="fg-ln fg-draw" stroke="var(--energy,#b8790f)"/><text class="fg-s" x="520" y="90">marginal cost</text><path d="M100,150 C250,170 420,200 590,215" class="fg-ln fg-draw" stroke="var(--climate,#a8323e)" style="animation-delay:.5s"/><text class="fg-s" x="520" y="235">marginal benefit</text><circle cx="398" cy="197" r="11" fill="var(--land,#4e7f2f)" class="fg-pulse"/><text class="fg-s" x="398" y="180" text-anchor="middle">optimum</text><g class=""><rect class="fg-box" x="640.0" y="98.0" width="240" height="64" rx="14" stroke="var(--economy,#5a4e8c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM15 9c-.5-1-1.6-1.5-3-1.5-1.8 0-3 .9-3 2.2 0 3 6 1.6 6 4.6 0 1.3-1.3 2.2-3 2.2-1.5 0-2.6-.6-3-1.6M12 6v1.5M12 16.5V18" transform="translate(653.0,117.0) scale(1.0833333333333333)" stroke="var(--economy,#5a4e8c)" stroke-width="2.03"/><text class="fg-h" x="774" y="126" text-anchor="middle" style="font-size:16px">Social cost of carbon</text><text class="fg-s" x="774" y="146" text-anchor="middle">damage of one more tonne</text></g><g class=""><rect class="fg-box" x="640.0" y="218.0" width="240" height="64" rx="14" stroke="var(--policy,#3d5a6c)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM12 7v5l3 3" transform="translate(653.0,237.0) scale(1.0833333333333333)" stroke="var(--policy,#3d5a6c)" stroke-width="2.03"/><text class="fg-h" x="774" y="246" text-anchor="middle" style="font-size:16px">Discount rate</text><text class="fg-s" x="774" y="266" text-anchor="middle">sets how much 2100 counts</text></g></svg>
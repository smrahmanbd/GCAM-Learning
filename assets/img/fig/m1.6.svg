<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GCAM marketplace"><title>GCAM marketplace</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">One marketplace links every system</text><text class="fg-s" x="24" y="54">In each 5-year step, prices move until supply equals demand in every market</text><g class="fg-pulse"><circle cx="450" cy="200" r="70" fill="var(--paper-2,#f1f5f7)" stroke="var(--ink,#14283a)" stroke-width="3"/><path class="fg-ic " d="M3 9l2-5h14l2 5M3 9h18v11H3zM3 9c0 2 4 2 4 0 0 2 5 2 5 0 0 2 5 2 5 0 0 2 4 2 4 0M10 20v-6h4v6" transform="translate(430.0,168.0) scale(1.6666666666666667)" stroke="var(--ink,#14283a)" stroke-width="1.32"/><text class="fg-h" x="450" y="236" text-anchor="middle" style="font-size:15px">Marketplace</text></g><g class="fg-spin" style="transform-origin:450px 200px;animation-duration:24s"><g><circle cx="450.11944900661" cy="80.00003804817985" r="34" fill="var(--economy-t,#ece9f6)" stroke="var(--economy,#5a4e8c)" stroke-width="3"/><path class="fg-ic " d="M9 11a3.5 3.5 0 1 0 0-7 3.5 3.5 0 0 0 0 7zM2.5 20c.6-3.6 3.2-6 6.5-6s5.9 2.4 6.5 6M16 4.5a3.2 3.2 0 0 1 0 6.2M18 14.3c2 .8 3.3 2.9 3.6 5.7" transform="translate(436.11944900661,66.00003804817985) scale(1.1666666666666667)" stroke="var(--economy,#5a4e8c)" stroke-width="1.89"/></g><g><circle cx="593.3004733688409" cy="164.53757520063925" r="34" fill="var(--energy-t,#fbf0dc)" stroke="var(--energy,#b8790f)" stroke-width="3"/><path class="fg-ic " d="M13 2 4 14h7l-1 8 9-12h-7l1-8z" transform="translate(579.3004733688409,150.53757520063925) scale(1.1666666666666667)" stroke="var(--energy,#b8790f)" stroke-width="1.89"/></g><g><circle cx="537.2524634195826" cy="297.60986057472485" r="34" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" stroke-width="3"/><path class="fg-ic " d="M5 19c0-9 6-14 15-14 0 9-5 15-14 15M5 19c3-4 6-6 10-8" transform="translate(523.2524634195826,283.60986057472485) scale(1.1666666666666667)" stroke="var(--land,#4e7f2f)" stroke-width="1.89"/></g><g><circle cx="361.7248324116981" cy="297.0195684583508" r="34" fill="var(--water-t,#e1edf7)" stroke="var(--water,#2470a8)" stroke-width="3"/><path class="fg-ic " d="M12 3s6 7 6 11a6 6 0 0 1-12 0c0-4 6-11 6-11z" transform="translate(347.7248324116981,283.0195684583508) scale(1.1666666666666667)" stroke="var(--water,#2470a8)" stroke-width="1.89"/></g><g><circle cx="307.0772678108543" cy="163.5750184749885" r="34" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" stroke-width="3"/><path class="fg-ic " d="M10 14V5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0zM12 9v7" transform="translate(293.0772678108543,149.5750184749885) scale(1.1666666666666667)" stroke="var(--climate,#a8323e)" stroke-width="1.89"/></g></g><rect x="680" y="300" width="40" height="20" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)"/><text class="fg-s" x="700" y="295" text-anchor="middle">2025</text><rect x="720" y="270" width="40" height="50" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)"/><text class="fg-s" x="740" y="265" text-anchor="middle">2030</text><rect x="760" y="240" width="40" height="80" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)"/><text class="fg-s" x="780" y="235" text-anchor="middle">2035</text><rect x="800" y="210" width="40" height="110" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)"/><text class="fg-s" x="820" y="205" text-anchor="middle">2040</text><rect x="840" y="180" width="40" height="140" fill="var(--policy-t,#e3eaee)" stroke="var(--policy,#3d5a6c)"/><text class="fg-s" x="860" y="175" text-anchor="middle">2045</text><text class="fg-s" x="760" y="345" text-anchor="middle">five-year staircase, no foresight</text></svg>
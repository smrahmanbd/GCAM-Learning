<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="How WITCH works"><title>How WITCH works</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">WITCH: regions play a game</text><text class="fg-s" x="24" y="54">Each region maximises its own welfare given the others' choices (Nash), or a coalition maximises joint welfare</text><g class=""><rect class="fg-box" x="105.0" y="100.0" width="190" height="60" rx="14" stroke="var(--water,#2470a8)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z" transform="translate(118.0,117.0) scale(1.0833333333333333)" stroke="var(--water,#2470a8)" stroke-width="2.03"/><text class="fg-h" x="214" y="126" text-anchor="middle" style="font-size:16px">Region A</text><text class="fg-s" x="214" y="146" text-anchor="middle">cuts a_A</text></g><g class=""><rect class="fg-box" x="105.0" y="240.0" width="190" height="60" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 21a9 9 0 1 0 0-18 9 9 0 0 0 0 18zM3 12h18M12 3c2.5 2.5 3.8 5.5 3.8 9s-1.3 6.5-3.8 9c-2.5-2.5-3.8-5.5-3.8-9S9.5 5.5 12 3z" transform="translate(118.0,257.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="214" y="266" text-anchor="middle" style="font-size:16px">Region B</text><text class="fg-s" x="214" y="286" text-anchor="middle">cuts a_B</text></g><path d="M300,130 C420,130 420,270 300,270" class="fg-ln fg-flow" stroke="var(--policy,#3d5a6c)"/><path d="M300,270 C380,270 380,130 300,130" class="fg-ln fg-flow" stroke="var(--policy,#3d5a6c)" style="animation-direction:reverse"/><text class="fg-s" x="440" y="205">best response</text><line x1="560" y1="300" x2="840" y2="300" stroke="var(--ink,#14283a)" stroke-width="2"/><rect x="590" y="220" width="90" height="80" fill="var(--climate-t,#f7e3e5)" stroke="var(--climate,#a8323e)" class="fg-grow"/><rect x="720" y="140" width="90" height="160" fill="var(--land-t,#e6f0dd)" stroke="var(--land,#4e7f2f)" class="fg-grow" style="animation-delay:.6s"/><text class="fg-s" x="635" y="320" text-anchor="middle">Nash</text><text class="fg-s" x="765" y="320" text-anchor="middle">cooperation</text><text class="fg-s" x="700" y="120" text-anchor="middle">global abatement</text></svg>
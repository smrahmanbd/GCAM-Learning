<svg class="fig-anim" viewBox="0 0 900 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Climate chain"><title>Climate chain</title><style>
.fg-t{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:15px;fill:var(--ink,#14283a)}
.fg-h{font-family:Archivo,"Arial Narrow",Arial,sans-serif;font-weight:700;font-size:18px;fill:var(--ink,#14283a)}
.fg-s{font-family:"Atkinson Hyperlegible Next",Arial,sans-serif;font-size:12.5px;fill:var(--muted,#5d6f7d)}
.fg-box{fill:var(--card,#ffffff);stroke-width:2.5}
.fg-ln{fill:none;stroke-width:3;stroke-linecap:round;stroke-linejoin:round}
.fg-ic{fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.fg-draw{stroke-dasharray:1400;stroke-dashoffset:1400;animation:fgDraw 3.2s ease-out infinite}
.fg-pop{transform-box:fill-box;transform-origin:center;animation:fgPop 4s ease-in-out infinite}
.fg-pulse{transform-box:fill-box;transform-origin:center;animation:fgPulse 2.4s ease-in-out infinite}
.fg-swing{transform-box:view-box;animation:fgSwing 3.6s ease-in-out infinite}
.fg-spin{transform-box:fill-box;transform-origin:center;animation:fgSpin 9s linear infinite}
.fg-flow{stroke-dasharray:10 10;animation:fgFlow 1s linear infinite}
.fg-grow{transform-box:fill-box;transform-origin:bottom;animation:fgGrow 4.5s ease-out infinite}
.fg-fade{animation:fgFade 4.5s ease-in-out infinite}
@keyframes fgDraw{0%{stroke-dashoffset:1400}60%,100%{stroke-dashoffset:0}}
@keyframes fgPop{0%,8%{opacity:0;transform:scale(.5)}18%,85%{opacity:1;transform:scale(1)}100%{opacity:0;transform:scale(.9)}}
@keyframes fgPulse{0%,100%{transform:scale(1)}50%{transform:scale(1.08)}}
@keyframes fgSwing{0%,100%{transform:rotate(-3deg)}50%{transform:rotate(3deg)}}
@keyframes fgSpin{to{transform:rotate(360deg)}}
@keyframes fgFlow{to{stroke-dashoffset:-20}}
@keyframes fgGrow{0%{transform:scaleY(0)}35%,90%{transform:scaleY(1)}100%{transform:scaleY(1);opacity:.4}}
@keyframes fgFade{0%,10%{opacity:0}25%,85%{opacity:1}100%{opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important}.fg-draw{stroke-dashoffset:0}}
</style><text class="fg-h" x="24" y="34">The climate chain</text><text class="fg-s" x="24" y="54">Each link turns one quantity into the next; CO2 stays for centuries, so the running total matters</text><g class=""><rect class="fg-box" x="25.0" y="140.0" width="170" height="80" rx="14" stroke="var(--energy,#b8790f)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 22c4 0 7-3 7-7 0-5-5-7-5-12-3 2-4 5-4 7-1-1-2-2-2-4-2 2-3 5-3 9 0 4 3 7 7 7z" transform="translate(38.0,167.0) scale(1.0833333333333333)" stroke="var(--energy,#b8790f)" stroke-width="2.03"/><text class="fg-h" x="124" y="176" text-anchor="middle" style="font-size:16px">Emissions</text><text class="fg-s" x="124" y="196" text-anchor="middle">Gt CO2 per year</text></g><g class=""><rect class="fg-box" x="245.0" y="140.0" width="170" height="80" rx="14" stroke="var(--climate,#a8323e)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M7 18a5 5 0 0 1-.5-10A6 6 0 0 1 18 9a4.5 4.5 0 0 1-.5 9z" transform="translate(258.0,167.0) scale(1.0833333333333333)" stroke="var(--climate,#a8323e)" stroke-width="2.03"/><text class="fg-h" x="344" y="176" text-anchor="middle" style="font-size:16px">Concentration</text><text class="fg-s" x="344" y="196" text-anchor="middle">ppm in the air</text></g><g class=""><rect class="fg-box" x="465.0" y="140.0" width="170" height="80" rx="14" stroke="var(--climate,#a8323e)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M12 17a5 5 0 1 0 0-10 5 5 0 0 0 0 10zM12 1v3M12 20v3M1 12h3M20 12h3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1" transform="translate(478.0,167.0) scale(1.0833333333333333)" stroke="var(--climate,#a8323e)" stroke-width="2.03"/><text class="fg-h" x="564" y="176" text-anchor="middle" style="font-size:16px">Forcing</text><text class="fg-s" x="564" y="196" text-anchor="middle">W per m²</text></g><g class=""><rect class="fg-box" x="685.0" y="140.0" width="170" height="80" rx="14" stroke="var(--climate,#a8323e)" fill="var(--card,#ffffff)"/><path class="fg-ic " d="M10 14V5a2 2 0 1 1 4 0v9a4 4 0 1 1-4 0zM12 9v7" transform="translate(698.0,167.0) scale(1.0833333333333333)" stroke="var(--climate,#a8323e)" stroke-width="2.03"/><text class="fg-h" x="784" y="176" text-anchor="middle" style="font-size:16px">Warming</text><text class="fg-s" x="784" y="196" text-anchor="middle">°C</text></g><path id="p809306" d="M197,180 L243,180" class="fg-ln fg-flow" stroke="var(--energy,#b8790f)"/><path d="M232.19463477176788,185.21958640933477 L243,180 L232.19463477176788,174.78041359066523" class="fg-ln" stroke="var(--energy,#b8790f)"/><circle r="6" fill="var(--energy,#b8790f)"><animateMotion dur="1.6s" repeatCount="indefinite"><mpath href="#p809306"/></animateMotion></circle><path id="p330446" d="M417,180 L463,180" class="fg-ln fg-flow" stroke="var(--climate,#a8323e)"/><path d="M452.1946347717679,185.21958640933477 L463,180 L452.1946347717679,174.78041359066523" class="fg-ln" stroke="var(--climate,#a8323e)"/><circle r="6" fill="var(--climate,#a8323e)"><animateMotion dur="1.9s" repeatCount="indefinite"><mpath href="#p330446"/></animateMotion></circle><path id="p870710" d="M637,180 L683,180" class="fg-ln fg-flow" stroke="var(--climate,#a8323e)"/><path d="M672.1946347717678,185.21958640933477 L683,180 L672.1946347717678,174.78041359066523" class="fg-ln" stroke="var(--climate,#a8323e)"/><circle r="6" fill="var(--climate,#a8323e)"><animateMotion dur="2.2s" repeatCount="indefinite"><mpath href="#p870710"/></animateMotion></circle><rect x="745" y="250" width="50" height="90" rx="10" fill="var(--paper-2,#f1f5f7)" stroke="var(--climate,#a8323e)" stroke-width="2"/><rect x="755" y="260" width="30" height="72" rx="6" fill="var(--climate,#a8323e)" class="fg-grow"/><text class="fg-t" x="380" y="300" text-anchor="middle">≈ 0.45 °C of warming for every 1,000 Gt of CO2 emitted</text></svg>